:root{--rojo:#FF3131;--coral:#FF6B6B;--noche:#2C2052;--amarillo:#FFF27F;--crema:#FBF7EE;--papel:#EFEAE4;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:500 16px/1.5 Poppins,Helvetica,Arial,sans-serif;color:var(--noche);
 background-color:var(--rojo);background-image:linear-gradient(135deg,var(--coral) 50%,transparent 50%);background-size:180px 180px;
 display:flex;align-items:center;justify-content:center;
 padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.caja{background:var(--crema);border-radius:6px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.circulo{width:72px;height:72px;border-radius:50%;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.circulo img{width:92%;height:92%;object-fit:cover}
h1{margin:0 0 4px;font-weight:900;font-size:30px;letter-spacing:-.05em;line-height:1}
p{margin:0 0 18px;font-size:14.5px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.campo{position:relative}
input{width:100%;font:inherit;font-size:18px;padding:12px 52px 12px 14px;border:2px solid var(--noche);border-radius:4px;background:#fff;color:var(--noche)}
.ojo{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:42px;height:42px;margin:0;padding:0;border:0;border-radius:4px;background:transparent;color:var(--noche);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ojo:hover{background:var(--papel)}
.ojo svg{width:24px;height:24px}
.ojo .tachado{display:none}.ojo[aria-pressed="true"] .tachado{display:inline}
input:focus-visible{outline:3px solid var(--amarillo);outline-offset:1px}
button.entrar{margin-top:14px;width:100%;font:inherit;font-weight:800;font-size:17px;padding:12px;border:0;border-radius:4px;background:var(--rojo);color:var(--crema);cursor:pointer}
button:focus-visible{outline:3px solid var(--noche);outline-offset:2px}
button.entrar[disabled]{opacity:.7;cursor:wait}
.error{color:var(--rojo);font-weight:700;font-size:14px;min-height:22px;margin-top:10px}
